maven:
  working-dir: /tmp/proto-build
  deploy:
    release:
      server-id: nexus-releases
      url: http://localhost:8081/repository/maven-releases/
    snapshot:
      server-id: nexus-snapshots
      url: http://localhost:8081/repository/maven-snapshots/
    # Override in production via environment variables; these are local-dev defaults only.
    username: ${MAVEN_DEPLOY_USERNAME:admin}
    password: ${MAVEN_DEPLOY_PASSWORD:admin}

server:
  port: 9080
