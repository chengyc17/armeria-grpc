spring:
  application:
    name: armeria-grpc-gateway

gateway:
  # Armeria 网关端口（非阻塞，HTTP/1.1 + HTTP/2）
  port: 9082
  nacos:
    # 环境值从本机 ops 目录 env.properties 读取（Windows: C:\ops\env.properties，Linux: ~/ops/env.properties）
    server-addr: 127.0.0.1:8848
    namespace: "${env}"
    group: DEFAULT_GROUP
    # 兜底刷新间隔（毫秒）；订阅推送偶发丢失时保证缓存最终一致
    refresh-interval-ms: 60000
  proxy:
    # 到后端实例的连接超时（毫秒）
    connect-timeout-ms: 3000
    # 等待后端响应的总超时（毫秒）
    response-timeout-ms: 60000
    # 客户端空闲连接保活时间（毫秒）
    idle-timeout-ms: 60000
    # 每个后端实例的最大连接数；HTTP/1.1 下决定单实例并发上限，HTTP/2 多路复用则几乎不受限
    max-num-connections-per-endpoint: 8
    # 请求/响应体大小上限（字节），默认 10 MiB
    max-request-length: 10485760
    max-response-length: 10485760
